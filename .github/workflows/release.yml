name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  FLUTTER_CHANNEL: 'master'  # Use master channel to get latest Flutter with Dart 3.7+
  # Disable interactive prompts on Windows
  CI: true
  PUB_CACHE: ${{ github.workspace }}/.pub-cache

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write  # Required to create releases
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            flutter-target: linux
            asset-name: v8ray-linux-x64
            asset-ext: tar.gz
          - os: windows-latest
            flutter-target: windows
            asset-name: v8ray-windows-x64
            asset-ext: zip
          - os: macos-latest
            flutter-target: macos
            asset-name: v8ray-macos-x64
            asset-ext: tar.gz

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: ${{ env.FLUTTER_CHANNEL }}
        cache: true

    - name: Install Linux dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update -y
        sudo apt-get install -y ninja-build libgtk-3-dev

    - name: Build Rust library (release)
      run: cargo build --release --lib
      working-directory: ./core

    - name: Install Flutter dependencies
      run: flutter pub get
      working-directory: ./app
      env:
        # Disable interactive prompts
        CI: true
        # Prevent "Terminate batch job" prompt on Windows
        FLUTTER_SUPPRESS_ANALYTICS: true
        PUB_ENVIRONMENT: bot.github

    - name: Build Flutter release
      run: flutter build ${{ matrix.flutter-target }} --release
      working-directory: ./app

    - name: Download Xray Core (Linux/macOS)
      if: matrix.os != 'windows-latest'
      run: bash scripts/post_build.sh release

    - name: Download Xray Core (Windows)
      if: matrix.os == 'windows-latest'
      run: scripts\post_build.bat release
      shell: cmd

    - name: Package release (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        cd app/build/linux/x64/release/bundle
        tar -czf ${{ github.workspace }}/${{ matrix.asset-name }}.tar.gz .

    - name: Package release (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        cd app/build/windows/x64/runner/Release
        Compress-Archive -Path * -DestinationPath ${{ github.workspace }}/${{ matrix.asset-name }}.zip
      shell: pwsh

    - name: Package release (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        echo "=== Debugging macOS Package ==="
        echo "Checking Flutter build output..."
        ls -la app/build/macos/Build/Products/Release/
        
        echo ""
        echo "Checking v8ray.app structure..."
        ls -la app/build/macos/Build/Products/Release/v8ray.app/ || echo "v8ray.app not found!"
        ls -la app/build/macos/Build/Products/Release/v8ray.app/Contents/ || echo "Contents not found!"
        ls -la app/build/macos/Build/Products/Release/v8ray.app/Contents/MacOS/ || echo "MacOS not found!"
        
        echo ""
        echo "Checking Rust library..."
        ls -la core/target/release/ | grep libv8ray || echo "Rust lib not in target/release/"
        
        # 复制 Rust 动态库到应用的 MacOS 目录
        if [ -f "core/target/release/libv8ray_core.dylib" ]; then
          echo "Copying libv8ray_core.dylib..."
          cp core/target/release/libv8ray_core.dylib app/build/macos/Build/Products/Release/v8ray.app/Contents/MacOS/
        else
          echo "ERROR: libv8ray_core.dylib not found!"
          exit 1
        fi
        
        # 验证动态库已复制
        echo ""
        echo "Final contents of v8ray.app/Contents/MacOS:"
        ls -la app/build/macos/Build/Products/Release/v8ray.app/Contents/MacOS/
        
        # 打包 - 确保使用正确的格式保留目录结构
        echo ""
        echo "Creating tar.gz archive..."
        cd app/build/macos/Build/Products/Release
        tar -cvzf ${{ github.workspace }}/${{ matrix.asset-name }}.tar.gz v8ray.app
        
        echo ""
        echo "Archive created, checking content:"
        tar -tzf ${{ github.workspace }}/${{ matrix.asset-name }}.tar.gz | head -20

    - name: Upload Release
      uses: softprops/action-gh-release@v1
      with:
        files: ${{ matrix.asset-name }}.${{ matrix.asset-ext }}
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
